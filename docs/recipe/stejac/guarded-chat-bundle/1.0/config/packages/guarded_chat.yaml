guarded_chat:
    enabled: '%env(bool:GUARDED_CHAT_ENABLED)%'

    # Service id of the Symfony AI platform that answers, for example the generic bridge for an
    # OpenAI-compatible gateway: ai.platform.generic.<name>
    platform: ai.platform.generic.default
    model: your-model

    prompt:
        # Fallback until a prompt version is stored in the database. Describe your assistant here.
        default: 'You are the assistant of this website. Answer only questions about its topic.'
        # pinned_instructions:
        #     - 'Answer in plain text without Markdown.'

