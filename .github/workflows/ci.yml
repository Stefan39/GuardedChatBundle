name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    if: github.repository != 'Stefan39/php-repo-template'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guarded_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GUARDED_CHAT_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/guarded_chat_test?serverVersion=16&charset=utf8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.3'
            dependencies: lowest
    steps:
      # Renovate pins these to commit SHAs (helpers:pinGitHubActionDigests).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: pcov
          # PHPUnit 13 counts assert() lines as executable; the production php.ini compiles them out.
          ini-values: zend.assertions=1
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: composer test -- --coverage-clover=coverage.xml
      - if: matrix.php == '8.5' && matrix.dependencies == 'highest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  static:
    if: github.repository != 'Stefan39/php-repo-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer phpstan
      - run: composer cs

  js:
    if: github.repository != 'Stefan39/php-repo-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: node --test "tests/js/*.test.mjs"
      - run: for f in assets/dist/*.js; do node --check "$f"; done

  install:
    if: github.repository != 'Stefan39/php-repo-template'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symfony: ['7.4', '8.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      # A fresh Flex skeleton, the bundle from this checkout and the recipe from docs/recipe.
      - run: tests/install/run.sh ${{ matrix.symfony }}
