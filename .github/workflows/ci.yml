name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    if: github.repository != 'Stefan39/php-repo-template'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.3'
            dependencies: lowest
    steps:
      # Renovate pins these to commit SHAs (helpers:pinGitHubActionDigests).
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: composer test -- --coverage-clover=coverage.xml
      - if: matrix.php == '8.5' && matrix.dependencies == 'highest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  static:
    if: github.repository != 'Stefan39/php-repo-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer phpstan
      - run: composer cs
